[project]
name = "flashcards-creator"
version = "0.1.0"
description = "Build CEFR-graded Anki decks of French vocabulary from a book chapter"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.8",
    "genanki>=0.13",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "gTTS>=2.5",
]

[project.optional-dependencies]
# Only needed for the `api` sense-resolver backend. The default `claude-cli`
# and `conversation` backends need no Python LLM dependency at all.
api = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
fcc = "flashcards_creator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flashcards_creator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
